site_name: RacerAPI
site_description: Modular, NestJS-inspired Python framework powered by FastAPI
site_author: Strix Engineering Studio
site_url: https://strix-engineering-studio.github.io/racerapi/
repo_url: https://github.com/strix-engineering-studio/racerapi
repo_name: strix-engineering-studio/racerapi
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link
plugins:
  - search
  - mermaid2
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Project Structure: project-structure.md
  - Core Concepts:
      - Architecture: core/architecture.md
      - Module System: core/module-system.md
      - Dependency Injection: core/dependency-injection.md
  - CLI:
      - Overview: cli/overview.md
      - Commands: cli/commands.md
      - Generators: cli/generators.md
  - Database:
      - Overview: database/overview.md
      - Migrations: database/migrations.md
  - Testing:
      - Overview: testing/overview.md
      - Fixtures: testing/fixtures.md
  - Architecture:
      - Rules: architecture/rules.md
      - Enforcement: architecture/enforcement.md
  - Deployment: deployment/production.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
