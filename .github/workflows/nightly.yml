name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"

          - "3.12"

          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7

        with:
          python-version: ${{ matrix.python-version }}

      - run: |

          python -m pip install --upgrade pip

          pip install -e .

          pip install pytest

      - run: |

          pytest
