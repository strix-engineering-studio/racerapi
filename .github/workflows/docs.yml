name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

        with:
          python-version: "3.12"

      - name: Install

        run: |

          pip install mkdocs

          pip install mkdocs-material

      - name: Deploy

        run: |

          mkdocs gh-deploy --force
