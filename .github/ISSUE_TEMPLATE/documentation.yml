name: Documentation
description: Report documentation issues or request improvements.
title: "[Docs]: "
labels:
  - documentation

body:
  - type: input
    id: page
    attributes:
      label: Page or File
      placeholder: README.md

  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested Improvement
