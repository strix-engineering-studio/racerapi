[tool.poetry]
name = "racerapi"
version = "1.0.0"
description = "A modular, NestJS-inspired Python application framework powered by FastAPI."
authors = ["Prathamesh More <iamprathamshmore07@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "racerapi", from = "src" }]
include = ["src/racerapi/templates/**/*"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.32,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
pydantic = ">=2.8,<3.0"
pydantic-settings = ">=2.4,<3.0"
typer = ">=0.12,<1.0"
alembic = ">=1.13,<2.0"
email-validator = ">=2.2,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-cov = ">=6.0,<7.0"
httpx = ">=0.27,<1.0"
httpx2 = ">=1.0"
ruff = ">=0.8,<1.0"
mypy = ">=1.13,<2.0"
build = ">=1.2,<2.0"
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocs-mermaid2-plugin = ">=1.2,<2.0"
mkdocstrings = { version = ">=0.27,<1.0", extras = ["python"] }

[tool.poetry.scripts]
racerapi = "racerapi.console:main"

[tool.poetry.urls]
Homepage = "https://github.com/strix-engineering-studio/racerapi"
Documentation = "https://strix-engineering-studio.github.io/racerapi/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
